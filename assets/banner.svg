<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">ChaoGarage</title>
  <desc id="d">ChaoGarage: an unofficial mod loader for Sonic &amp; SEGA All-Stars Racing on PC. Original artwork: a garage door with two linked parts and speed lines.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="0.55" stop-color="#123a7a"/>
      <stop offset="1" stop-color="#1f6fd1"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#c9d6ee"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#sky)"/>
  <!-- speed lines -->
  <g fill="url(#road)">
    <rect x="40" y="70" width="250" height="6" rx="3"/>
    <rect x="90" y="104" width="230" height="4" rx="2"/>
    <rect x="20" y="214" width="280" height="6" rx="3"/>
    <rect x="110" y="248" width="210" height="4" rx="2"/>
  </g>
  <!-- garage: arch, roller door, two linked parts (the matching loader files) -->
  <g transform="translate(330 46)">
    <path d="M0 228 V96 Q0 0 112 0 Q224 0 224 96 V228 Z" fill="#0a1630" opacity="0.55"/>
    <path d="M14 228 V100 Q14 16 112 16 Q210 16 210 100 V228 Z" fill="url(#door)"/>
    <g stroke="#9fb3d9" stroke-width="4" stroke-linecap="round">
      <line x1="30" y1="120" x2="194" y2="120"/>
      <line x1="30" y1="146" x2="194" y2="146"/>
      <line x1="30" y1="172" x2="194" y2="172"/>
      <line x1="30" y1="198" x2="194" y2="198"/>
    </g>
    <g transform="translate(58 44)">
      <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#gold)"/>
      <rect x="58" y="0" width="50" height="50" rx="12" fill="#2fd27b"/>
      <circle cx="54" cy="25" r="11" fill="#0b1b3a"/>
      <circle cx="54" cy="25" r="5" fill="#f6f8fc"/>
    </g>
  </g>
  <!-- name and lines: sized so that even a wide fallback font (about 0.6 em per character) stays inside the canvas -->
  <text x="610" y="146" font-family="Segoe UI, Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="70" font-weight="800" fill="#ffffff">ChaoGarage</text>
  <text x="614" y="190" font-family="Segoe UI, Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#d6e4ff">Mod loader for Sonic &amp; SEGA All-Stars Racing (PC)</text>
  <text x="614" y="228" font-family="Segoe UI, Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#ffd84d">Two files · one release · one clear message</text>
  <text x="614" y="266" font-family="Segoe UI, Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="14" fill="#9fb3d9">Unofficial fan project · not affiliated with SEGA</text>
</svg>
